[project]
name = "pandemonium-telegram-bot"
version = "0.1.0"
description = "Pandemonium Telegram bot — bridge to Claude Code CLI"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.0,<4.0",
    "aiosqlite>=0.20,<1.0",
    "pyyaml>=6.0,<7.0",
    "pydantic>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pandemonium"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
