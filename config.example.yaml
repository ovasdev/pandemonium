# Pandemonium Telegram bot Configuration
# Copy to ~/.pandemonium/config.yaml and fill in your values.

telegram:
  bot_token: "YOUR_BOT_TOKEN_HERE"

allowed_users:
  - telegram_id: 123456789
    name: "Alice"

projects:
  - id: "my-app"
    name: "My Application"
    path: "/home/user/projects/my-app"

storage:
  base_path: "~/.pandemonium/sessions"  # root folder for session protocols

token_budget:
  per_request_limit: 0  # max tokens per request (0 = unlimited)

timeouts:
  request_max_seconds: 1800  # 30 minutes
